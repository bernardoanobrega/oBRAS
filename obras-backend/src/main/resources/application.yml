spring:
  application:
    name: obras
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/obras}
    username: ${DB_USER:obras}
    password: ${DB_PASSWORD:obras}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # o schema é responsabilidade do Flyway
    properties:
      hibernate.jdbc.time_zone: America/Maceio
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB         # RNF-10
      max-request-size: 10MB

app:
  jwt:
    secret: ${JWT_SECRET}         # >= 32 caracteres; nunca no repositório
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  storage:
    base-path: ${STORAGE_PATH:./uploads}
  bootstrap:
    admin:
      enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
      login: ${BOOTSTRAP_ADMIN_LOGIN:admin}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
